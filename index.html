<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preguntale al asistente de Viv</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; color: #1f2937; }
    .app { max-width: 640px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 16px; }
    h1 { font-size: 1.2rem; margin: 0 0 4px; }
    p.sub { margin: 0 0 12px; color: #6b7280; font-size: 0.9rem; }
    #chat { flex: 1; overflow-y: auto; background: #fff; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; line-height: 1.4; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .model { align-self: flex-start; background: #e5e7eb; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; }
    button { padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    .note { font-size: 0.75rem; color: #9ca3af; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Preguntale al asistente de Viv</h1>
    <p class="sub">Experiencia, formación, habilidades y trayectoria. Respondo solo con información de su perfil.</p>
    <div id="chat"></div>
    <form id="form">
      <input id="input" maxlength="500" placeholder="Ej: ¿Qué experiencia tiene en gestión de proyectos?" autocomplete="off" />
      <button id="send" type="submit">Enviar</button>
    </form>
    <div class="note">Asistente con IA: puede equivocarse. Ante la duda, contactá a Viv directamente.</div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const history = [];

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    addMessage("model", "¡Hola! Soy el asistente de Viv. Preguntame sobre su experiencia, formación o trayectoria.");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage("user", text);
      history.push({ role: "user", text });
      input.value = "";
      send.disabled = true;
      const loading = addMessage("model", "Escribiendo...");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        const reply = data.reply || "No pude responder en este momento.";
        loading.textContent = reply;
        history.push({ role: "model", text: reply });
      } catch {
        loading.textContent = "No pude conectarme. Probá de nuevo en un momento.";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
